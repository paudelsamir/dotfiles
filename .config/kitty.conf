# ==============================================
# KITTY CONFIGURATION - Ocean Dark + Hyprland
# ==============================================

# ============================================
# FONTS
# ============================================
font_family      JetBrains Mono Nerd Font
italic_font      JetBrains Mono Nerd Font Italic
bold_font        JetBrains Mono Nerd Font Bold
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        11.0

# ============================================
# CURSOR
# ============================================
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 3.0

# ============================================
# WINDOW & LAYOUT
# ============================================
# Transparency (sleek look)
background_opacity 1.0
background_blur 20
dynamic_background_opacity yes

# Window decorations
hide_window_decorations titlebar-only
window_border_width 0.5pt

# Padding for breathing room
window_padding_width 12

# Margin
window_margin_width 0

# Tab bar styling
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background none

# Tab colors matching ocean_dark
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #c0caf5
inactive_tab_background #1a1b26
inactive_tab_font_style italic

# ============================================
# COLORS - Ocean Dark Theme
# ============================================
foreground            #c0caf5
background            #16161e
selection_foreground  #16161e
selection_background  #7aa2f7

# Cursor
cursor                #7dcfff
cursor_text_color     #16161e

# URLs
url_color             #7aa2f7
url_style curly

# 16 ANSI Colors
color0  #1a1b26
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ============================================
# SHELL & BEHAVIOR
# ============================================
shell fish
shell_integration enabled

confirm_os_window_close 0
clear_all_shortcuts no

# Scrollback
scrollback_lines 5000
scrollback_indicator_opacity 0.5

# Mouse
mouse_hide_wait 3.0
click_interval 0.5
pointer_shape_when_grabbed beam
default_pointer_shape beam

# Copy/Paste
copy_on_select yes
paste_actions quote-urls-at-prompt

# ============================================
# PERFORMANCE
# ============================================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ============================================
# KEY BINDINGS
# ============================================

# Copy/Paste
map ctrl+c    copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Search
map ctrl+f    launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll
map page_up    scroll_page_up
map page_down  scroll_page_down
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down

# Font size
map ctrl+plus  change_font_size all +1
map ctrl+equal change_font_size all +1
map ctrl+kp_add change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+underscore change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Tab management
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

# Window management (Hyprland compatible)
map kitty_mod+enter new_window
map kitty_mod+n new_os_window
map kitty_mod+w close_window
map ctrl+alt+right next_window
map ctrl+alt+left previous_window
map ctrl+alt+up previous_window
map ctrl+alt+down next_window

# Layout
map kitty_mod+l next_layout
map kitty_mod+] move_window_forward
map kitty_mod+[ move_window_backward

# Terminal features
map shift+enter send_text all \e\r

# ============================================
# HYPRLAND INTEGRATION
# ============================================
# Allow remote control for better window management
allow_remote_control yes
listen_on unix:/tmp/kitty

# Disable title for cleaner look with window manager
macos_show_window_title_in_menubar no
x11_hide_window_decorations yes

# ============================================
# STARTUP
# ============================================
# Remember window size
remember_window_size no
initial_window_width 120c
initial_window_height 40c

# Don't ask on close
confirm_os_window_close 0

# ============================================
# MODERN & SLEEK TWEAKS
# ============================================
# Smooth bell
visual_bell_duration 0
enable_audio_bell yes

# Better rendering
term xterm-256color
box_drawing_scale 0.001, 1, 1.5, 2
