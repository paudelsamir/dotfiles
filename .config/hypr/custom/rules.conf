# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# CopyQ clipboard popup - small floating overlay like scratchpad
windowrule = float 1, match:class ^(com\.github\.hluk\.copyq)$
windowrule = size 50% 60%, match:class ^(com\.github\.hluk\.copyq)$
windowrule = center 1, match:class ^(com\.github\.hluk\.copyq)$
windowrule = animation popin 80%, match:class ^(com\.github\.hluk\.copyq)$


