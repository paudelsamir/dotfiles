# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# CopyQ clipboard popup - small floating overlay like scratchpad
windowrulev2 = float, class:^(com\.github\.hluk\.copyq)$
windowrulev2 = size 50% 60%, class:^(com\.github\.hluk\.copyq)$
windowrulev2 = center, class:^(com\.github\.hluk\.copyq)$
windowrulev2 = dimaround, class:^(com\.github\.hluk\.copyq)$
windowrulev2 = stayfocused, class:^(com\.github\.hluk\.copyq)$
windowrulev2 = animation popin 80%, class:^(com\.github\.hluk\.copyq)$


