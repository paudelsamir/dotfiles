# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Authentication Agent
exec-once = hyprpolkitagent

# Notification Daemon
exec-once = mako

# Clipboard Manager: CopyQ (primary clipboard manager with history)
# exec-once = copyq &

# Monitor resolution fixer - prevents downscaling when locking
exec-once = ~/.config/hypr/fix_resolution.sh &
